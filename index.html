<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Served from a subpath: make sure the URL ends in a slash so relative src/ paths resolve.
      if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
    </script>
    <title>Beetle - Bug World Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #050309; color: #8f84a3; font: 13px Georgia, serif; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
      canvas {
        display: block;
        width: min(100vw, calc((100vh - 40px) * 320 / 192));
        aspect-ratio: 320 / 192;
        background: #0b0710;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div>
      Arrows/WASD move &middot; Space/Z jump &middot; X/J attack (hold Up/Down to aim; Down only in air)
      &middot; E interact &middot; M map
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
